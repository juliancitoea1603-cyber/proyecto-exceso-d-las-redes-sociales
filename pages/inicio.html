
  <section class="seccion-galeria">
    <div class="container">

    

      <!-- Carrusel Bootstrap -->
      <div
        id="carruselImagenes"
        class="carousel slide carousel-fade carrusel-proyecto"
        data-bs-ride="carousel"
        data-bs-interval="5000"
      >

        <!-- Indicadores -->
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carruselImagenes"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Imagen 1"
          ></button>

          <button
            type="button"
            data-bs-target="#carruselImagenes"
            data-bs-slide-to="1"
            aria-label="Imagen 2"
          ></button>

          <button
            type="button"
            data-bs-target="#carruselImagenes"
            data-bs-slide-to="2"
            aria-label="Imagen 3"
          ></button>
        </div>

        <!-- Imágenes -->
        <div class="carousel-inner">

          <!-- Imagen 1 -->
          <div class="carousel-item active">
            <img
              src="img/portada1.png"
              class="d-block w-100"
              alt="portada1.png"
            >

          </div>

          <!-- Imagen 2 -->
          <div class="carousel-item">
            <img
              src="img/portada2.png"
              class="d-block w-100"
              alt="portada2.png"
            >

         
          </div>

          <!-- Imagen 3 -->
          <div class="carousel-item">
            <img
              src="img/portada3.png"
              class="d-block w-100"
              alt="portada3.png"
            >

        
          </div>

        </div>

        <!-- Botón anterior -->
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carruselImagenes"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>

        <!-- Botón siguiente -->
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carruselImagenes"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>

      </div>
    </div>
  </section>
